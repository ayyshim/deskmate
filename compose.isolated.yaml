# Isolated mode: the desk joins a bridge network, so its browser reaches the internet but not this
# machine's localhost services. The hub still reaches Chromium's DevTools through a published port
# on 127.0.0.1 (forwarded inside the desk by socat, because Chromium binds DevTools to loopback).
#
#   docker compose -f compose.yaml -f compose.isolated.yaml up -d     (or: make isolated)
services:
  desk:
    network_mode: bridge
    environment:
      CDP_PUBLISH: "1"
    ports:
      - "127.0.0.1:7802:7812"
